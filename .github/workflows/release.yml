name: Release

on:
  push:
    tags:
      - 0.*

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pas de cache Maven : un cache empoisonne finirait dans le JAR publie.
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true

      - name: Set version
        run: mvn -B versions:set -DnewVersion="$GITHUB_REF_NAME"

      - name: Build
        run: mvn -B package --file pom.xml

      - name: Upload release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/sonar-flutter-plugin/target/*.jar
          tag: ${{ github.ref_name }}
          overwrite: true
          body: "See [CHANGELOG.md](https://github.com/diagngrow/sonar-flutter/blob/master/CHANGELOG.md) for the details of this release."
          file_glob: true
